# The experiment Elasticsearch cluster, managed by the ECK operator.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: hons
spec:
  version: 9.5.4
  secureSettings:
    - secretName: hons-s3-credentials
  nodeSets:
    - name: data
      count: 4
      config:
        s3.client.default.endpoint: https://object-arbutus.alliancecan.ca
        s3.client.default.path_style_access: true
        s3.client.default.region: us-east-1
      podTemplate:
        spec:
          nodeSelector:
            role: es-data
          tolerations:
            - key: dedicated
              operator: Equal
              value: elasticsearch
              effect: NoSchedule
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      elasticsearch.k8s.elastic.co/cluster-name: hons
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: elasticsearch
              resources:
                requests:
                  memory: 2Gi
                  cpu: 500m
                limits:
                  memory: 2Gi
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: local-path
            resources:
              requests:
                storage: 20Gi
