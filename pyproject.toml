[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "Patrik-HonoursThesis"
version = "0.1.0"
description = "evaluating-elasticsearch-storage-architectures-for-open-source-repository-activity-at-scale"
requires-python = ">=3.14"
dependencies = ["elasticsearch>=9,<10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
