title: Documentation
description: Evaluating Elasticsearch storage architectures for open source repository activity at scale
theme: just-the-docs
color_scheme: staser

logo: "/STASER_logo.png"
search_enabled: true

aux_links:
  "GitHub repository": "https://github.com/STASER-Lab/Patrik-HonoursThesis"
aux_links_new_tab: true

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links

relative_links:
  enabled: true

defaults:
  - scope: { path: "" }
    values: { layout: "default" }
  - scope: { path: "requirements.md" }
    values: { title: "Requirements", nav_order: 2 }
  - scope: { path: "design.md" }
    values: { title: "Design (TBC)", nav_order: 3 }
  # TBC: Finish writing the following documentation
  #- scope: { path: "pipeline/extract.md" }
  #  values: { title: "Extract", parent: "Design", nav_order: 1 }
  #- scope: { path: "pipeline/transform.md" }
  #  values: { title: "Transform", parent: "Design", nav_order: 2 }
  #- scope: { path: "pipeline/load.md" }
  #  values: { title: "Load", parent: "Design", nav_order: 3 }
  #- scope: { path: "pipeline/model.md" }
  #  values: { title: "Model", parent: "Design", nav_order: 4 }
  #- scope: { path: "pipeline/test.md" }
  #  values: { title: "Test", parent: "Design", nav_order: 5 }
  - scope: { path: "about.md" }
    values: { title: "About", nav_order: 6 }
  - scope: { path: "references.md" }
    values: { title: "References", nav_order: 7 }

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - AI_LOG.md
  - decisions.md
  - data-profile-2024.md
  - record-model.md
  - mappings.md
  - pipeline/extract.md
  - pipeline/transform.md
  - pipeline/load.md
  - pipeline/model.md
  - pipeline/test.md
