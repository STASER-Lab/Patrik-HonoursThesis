title: Documentation
description: Evaluating document storage layouts in distributed systems for software repository activity
theme: just-the-docs
color_scheme: staser

logo: "/assets/images/staser-logo.png"
favicon_ico: "/assets/images/favicon.ico"
search_enabled: true

aux_links:
  "GitHub repository": "https://github.com/STASER-Lab/Patrik-HonoursThesis"
aux_links_new_tab: true

sass:
  silence_deprecations: ["import", "global-builtin", "color-functions"]

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links

relative_links:
  enabled: true

defaults:
  - scope: { path: "" }
    values: { layout: "default" }
  - scope: { path: "design.md" }
    values: { title: "Design", nav_order: 2 }
  - scope: { path: "profile.md" }
    values: { title: "Profile", nav_order: 3 }
  - scope: { path: "tutorial.md" }
    values: { title: "Tutorial", nav_order: 4 }
  - scope: { path: "references.md" }
    values: { title: "References", nav_order: 5 }

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
